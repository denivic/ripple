[package]
name = "ripple"
version = "0.1.0"
description = "Ripple — the cumulative cost of a habit, made immediate and legible."
authors = ["denivic"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ripple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Local OS notifications and launch-at-login, driven from Rust.
tauri-plugin-notification = "=2.4.0"
tauri-plugin-autostart = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
calamine = { version = "0.30", features = ["dates"] }
# `clock` for the scheduler's local wall time (`time`'s local offset is
# unreliable in a multithreaded process on macOS).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust_xlsxwriter = "0.89"
csv = "1"
snap = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Blocking HTTP for the exchange-rate fetch; rustls so no system OpenSSL.
sys-locale = "=0.3.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# Notification email over SMTP: blocking transport + message builder,
# rustls only (no native-tls/OpenSSL).
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
# Email secrets live in the OS keychain: macOS Keychain, Windows Credential Manager.
keyring = { version = "=4.2.0" }

[dev-dependencies]
tempfile = "3"

